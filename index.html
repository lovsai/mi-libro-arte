<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sai's sketchbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-paper-desk: #ebe3d3;
      --paper-cream: #faf6ed;
      --paper-edge: #e4dac6;
      --paper-dark: #eee6d5;
      --ink-primary: #1f1b18;
      --ink-secondary: #544b42;
      --gold-light: #e6c677;
      --gold-mid: #c59b3c;
      --gold-dark: #7d5c18;
      --accent-terracotta: #9e4736;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-paper-desk);
      background-image:
        radial-gradient(circle at 50% 45%, rgba(252, 248, 238, 0.7) 0%, rgba(218, 206, 184, 0.85) 100%);
      color: var(--ink-primary);
      font-family: 'Lora', serif;
      min-height: 100vh;
      padding: 26px 24px 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ILUSTRACIONES GRANDES A TINTA / GRABADO EN TODO EL FONDO */
    .bg-etching {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.42;
    }
    .etch-adam {
      top: -10px;
      left: -20px;
      width: 680px;
      transform: rotate(-2deg);
    }
    .etch-eros {
      top: -15px;
      right: -10px;
      width: 500px;
      transform: rotate(3deg);
    }
    .etch-beso-lima {
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 780px;
      opacity: 0.45;
    }

    @media (max-width: 1150px) {
      .etch-adam { width: 480px; }
      .etch-eros { width: 380px; }
      .etch-beso-lima { width: 580px; }
    }
    @media (max-width: 720px) {
      .etch-adam { width: 320px; opacity: 0.32; }
      .etch-eros { width: 260px; opacity: 0.32; }
      .etch-beso-lima { width: 400px; opacity: 0.35; }
    }

    /* TÍTULO PRINCIPAL */
    .header-desk {
      text-align: center;
      color: var(--ink-primary);
      margin-bottom: 16px;
      position: relative;
      z-index: 6;
      background: rgba(250, 246, 237, 0.72);
      padding: 6px 26px;
      border-radius: 30px;
      backdrop-filter: blur(2px);
    }
    .header-desk h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.65rem;
      letter-spacing: 0.03em;
      font-weight: 700;
    }

    /* Pestañas estilo marcapáginas */
    .bookmark-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: -2px;
      z-index: 6;
      position: relative;
    }
    .tab-btn {
      background: #dfd4be;
      border: 1px solid #b5a382;
      border-bottom: none;
      padding: 8px 22px;
      border-radius: 10px 10px 0 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }
    .tab-btn.active {
      background: var(--paper-cream);
      color: var(--ink-primary);
      transform: translateY(-3px);
      border-top: 3px solid var(--gold-mid);
    }

    /* LIBRETA ABIERTA COMPACTA EN EL CENTRO CON HOJAS EN ABANICO */
    .book-stage {
      width: 100%;
      max-width: 840px;
      position: relative;
      z-index: 4;
      margin: 0 auto;
    }

    .page-fan-left-2,
    .page-fan-left-1,
    .page-fan-right-1,
    .page-fan-right-2 {
      position: absolute;
      top: 10px;
      bottom: 10px;
      width: 36px;
      background: var(--paper-edge);
      border: 1px solid #bfae91;
      border-radius: 12px;
      z-index: -1;
      box-shadow: 0 12px 24px rgba(45, 35, 20, 0.22);
    }
    .page-fan-left-1 { left: -12px; background: #efe7d6; }
    .page-fan-left-2 { left: -24px; top: 18px; bottom: 18px; background: #dfd5c0; z-index: -2; }
    .page-fan-right-1 { right: -12px; background: #efe7d6; }
    .page-fan-right-2 { right: -24px; top: 18px; bottom: 18px; background: #dfd5c0; z-index: -2; }

    /* Pliego abierto liso */
    .sketchbook-spread {
      width: 100%;
      min-height: 540px;
      background-color: var(--paper-cream);
      background-image:
        linear-gradient(
          to right,
          rgba(0,0,0,0.06) 0%,
          rgba(255,255,255,0.3) 6%,
          transparent 44%,
          rgba(60, 45, 25, 0.08) 48.5%,
          rgba(40, 30, 15, 0.2) 50%,
          rgba(60, 45, 25, 0.08) 51.5%,
          transparent 56%,
          rgba(255,255,255,0.3) 94%,
          rgba(0,0,0,0.06) 100%
        );
      border-radius: 14px;
      box-shadow:
        0 24px 48px rgba(40, 30, 15, 0.28),
        inset 0 0 28px rgba(175, 155, 120, 0.22);
      padding: 30px 32px;
      position: relative;
      border: 1px solid #cbbba0;
    }

    /* SECCIÓN 1: MI PEQUEÑA COLECCIÓN (Marcos dorados de museo) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 28px;
    }

    .gold-frame-card {
      background: #fffdf9;
      padding: 12px;
      border: 9px solid transparent;
      border-image: linear-gradient(135deg, var(--gold-dark), var(--gold-light), var(--gold-mid), var(--gold-dark)) 1;
      box-shadow:
        0 10px 20px rgba(35, 25, 10, 0.2),
        inset 0 0 10px rgba(125, 92, 24, 0.32);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .gold-frame-card:hover {
      transform: translateY(-5px) rotate(-0.6deg);
      box-shadow: 0 16px 28px rgba(35, 25, 10, 0.28);
    }
    .gold-frame-inner {
      border: 2px solid #e5dcc8;
      padding: 5px;
      background: #f6f1e3;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gold-frame-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .museum-plaque {
      margin-top: 10px;
      text-align: center;
      border-top: 1px solid #e2d6be;
      padding-top: 6px;
    }
    .museum-plaque h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.12rem;
      font-weight: 700;
    }
    .museum-plaque p {
      font-size: 0.76rem;
      color: var(--ink-secondary);
      font-style: italic;
    }

    /* SECCIÓN 2: WISHLIST TIPO PINTEREST + ASISTENTE DE INSPIRACIÓN */
    .inspiration-box {
      background: #fffcf5;
      border: 1.5px solid #c9b693;
      border-radius: 10px;
      padding: 15px 18px;
      margin-bottom: 24px;
      box-shadow: 2px 3px 0px rgba(180, 160, 120, 0.3);
    }
    .inspiration-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: var(--ink-primary);
    }
    .inspiration-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .inspiration-controls input {
      flex: 1;
      min-width: 210px;
      padding: 9px 12px;
      border: 1px solid #cbb998;
      border-radius: 8px;
      background: var(--paper-cream);
      font-family: 'Lora', serif;
      font-size: 0.9rem;
    }
    .btn-muse {
      background: var(--ink-primary);
      color: var(--paper-cream);
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-muse:hover { background: var(--accent-terracotta); }
    .inspiration-result {
      margin-top: 12px;
      padding: 12px;
      background: var(--paper-dark);
      border-left: 3px solid var(--gold-mid);
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      line-height: 1.5;
      display: none;
    }

    .pinterest-masonry {
      column-count: 3;
      column-gap: 18px;
    }
    @media (max-width: 780px) { .pinterest-masonry { column-count: 2; } }
    @media (max-width: 500px) { .pinterest-masonry { column-count: 1; } }

    .pin-card {
      break-inside: avoid;
      background: #fffdf9;
      border: 1px solid #d4c5a9;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 18px;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.08);
      position: relative;
    }
    .pin-card::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 54px;
      height: 14px;
      background: rgba(214, 189, 138, 0.55);
    }
    .pin-card img {
      width: 100%;
      border-radius: 4px;
      display: block;
      margin-bottom: 8px;
    }
    .pin-card h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.08rem;
      margin-bottom: 3px;
    }
    .pin-card p {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--ink-secondary);
      margin-bottom: 8px;
    }
    .pin-actions {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .btn-hecho {
      background: #4e6e58;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: 'Lora', serif;
    }
    .btn-delete {
      background: transparent;
      color: #9e473b;
      border: 1px solid #d8b4ae;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.76rem;
      cursor: pointer;
    }

    /* BOTÓN FLOTANTE CON FORMA DE LIRIO GRABADO ANIMADO */
    .lily-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #fffdf8;
      border: 2px solid var(--gold-mid);
      box-shadow: 0 10px 25px rgba(35, 25, 10, 0.28);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.3s ease;
    }
    .lily-fab:hover { transform: scale(1.08); }
    .lily-svg {
      width: 60px;
      height: 60px;
      animation: lilyBloom 4s ease-in-out infinite;
    }
    @keyframes lilyBloom {
      0%, 100% { transform: rotate(-3deg) scale(1); }
      50% { transform: rotate(4deg) scale(1.06); }
    }
    .lily-tooltip {
      position: fixed;
      bottom: 40px;
      right: 112px;
      background: var(--paper-cream);
      color: var(--ink-primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Caveat', cursive;
      font-size: 1.22rem;
      box-shadow: 0 4px 12px rgba(35, 25, 10, 0.2);
      border: 1px solid var(--gold-mid);
      pointer-events: none;
      z-index: 50;
    }

    /* MODALES */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 30, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--paper-cream);
      border: 2px solid var(--gold-mid);
      border-radius: 14px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--ink-secondary);
    }
    .form-group { margin-bottom: 13px; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid #c6b596;
      border-radius: 8px;
      background: #fffdf8;
      font-family: 'Lora', serif;
    }
    .detail-img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border: 6px solid var(--gold-mid);
      background: #efe8d8;
      margin-bottom: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- GRABADO 1 (ARRIBA IZQUIERDA): La Creación de Adán completa a tinta -->
  <div class="bg-etching etch-adam">
    <svg viewBox="0 0 600 280" fill="none" stroke="#1f1b18" stroke-linecap="round" stroke-linejoin="round">
      <!-- Roca y cuerpo completo de Adán reclinado a la izquierda -->
      <path d="M18 215 C35 190, 58 175, 88 182" stroke-width="1.6" />
      <!-- Cabeza y perfil de Adán mirando hacia la derecha -->
      <path d="M72 110 C64 110, 58 117, 60 126 C62 134, 70 138, 78 135 C85 132, 88 123, 84 116 C81 111, 76 110, 72 110 Z" stroke-width="2" />
      <path d="M60 118 C64 108, 76 105, 84 112" stroke-width="2.2" />
      <!-- Torso, pecho y abdomen -->
      <path d="M74 138 C70 156, 66 178, 76 196 C88 212, 112 214, 132 204" stroke-width="2" />
      <path d="M88 144 C104 148, 120 154, 134 150" stroke-width="1.8" />
      <path d="M82 166 C96 168, 108 166, 118 162 M86 180 C98 182, 110 180, 120 176" stroke-width="1.1" />
      <!-- Pierna flexionada y pierna extendida de Adán -->
      <path d="M116 198 C126 170, 144 152, 158 162 C168 170, 156 198, 146 218" stroke-width="2.1" />
      <path d="M132 206 C168 218, 206 234, 242 252 C248 256, 242 262, 232 258 C196 244, 158 232, 124 222" stroke-width="2" />
      <!-- Brazo izquierdo de Adán extendido hacia el dedo de Dios -->
      <path d="M128 146 C154 138, 182 132, 212 134 C222 135, 228 138, 224 141 C216 142, 208 141, 200 144" stroke-width="2" />
      <path d="M200 144 C210 146, 218 149, 214 152 C206 152, 198 150, 188 151 C166 154, 146 160, 126 164" stroke-width="1.7" />
      <!-- Achurado de grabado en Adán -->
      <path d="M72 152 L82 156 M70 164 L80 168 M72 176 L84 180 M76 188 L90 192 M140 172 L152 178 M168 224 L182 230" stroke-width="1" />

      <!-- Manto celestial envolviendo al Creador y los ángeles a la derecha -->
      <path d="M336 62 C368 24, 445 12, 515 32 C568 48, 588 98, 574 148 C560 196, 514 226, 456 228 C406 230, 362 204, 344 166" stroke-width="2.2" />
      <path d="M348 68 C382 32, 452 22, 512 42 C558 58, 576 102, 562 146" stroke-width="1.2" />
      <!-- Figura del Creador volando con túnica -->
      <path d="M372 72 C362 72, 355 80, 357 90 C359 98, 368 102, 376 99 C383 96, 386 86, 382 78" stroke-width="2" />
      <!-- Barba y cabellera fluida -->
      <path d="M362 94 C356 104, 358 114, 366 116 C374 114, 378 104, 376 96" stroke-width="1.6" />
      <path d="M376 74 C390 70, 402 78, 400 92" stroke-width="1.8" />
      <!-- Brazo derecho del Creador extendido -->
      <path d="M356 108 C322 116, 286 124, 248 132 C240 134, 242 138, 250 138 C286 134, 322 128, 358 124" stroke-width="2.2" />
      <path d="M250 138 L266 142 L252 146 L268 149" stroke-width="1.5" />
      <!-- Túnica y cuerpo del Creador con pliegues de grabado -->
      <path d="M362 118 C392 116, 428 124, 462 142 C494 158, 526 178, 558 192" stroke-width="2" />
      <path d="M376 138 C408 144, 438 158, 468 176 C496 192, 524 206, 552 214" stroke-width="1.8" />
      <path d="M392 126 L418 142 M408 124 L436 144 M426 128 L454 150 M444 136 L474 160 M468 152 L498 176" stroke-width="1" />
      <!-- Querubines alrededor dentro del manto -->
      <circle cx="426" cy="78" r="11" stroke-width="1.6" />
      <circle cx="464" cy="72" r="12" stroke-width="1.6" />
      <circle cx="496" cy="96" r="11" stroke-width="1.6" />
      <circle cx="412" cy="176" r="11" stroke-width="1.6" />
      <path d="M448 86 C444 102, 448 116, 460 122 M482 108 C478 124, 484 138, 496 144" stroke-width="1.4" />
    </svg>
  </div>

  <!-- GRABADO 2 (ARRIBA DERECHA): Eros y Psique lineal continuo -->
  <div class="bg-etching etch-eros">
    <svg viewBox="0 0 420 480" fill="none" stroke="#1f1b18" stroke-linecap="round" stroke-linejoin="round">
      <!-- Brazo izquierdo arqueado hacia la cabeza de Eros -->
      <path d="M96 360 C72 280, 62 210, 74 168 C84 134, 114 108, 146 86 C172 68, 206 52, 238 56 C272 60, 304 86, 334 118 C362 148, 376 178, 368 214 C360 250, 342 302, 326 364" stroke-width="2.1" />
      <!-- Manos de Psique acariciando los rizos de Eros -->
      <path d="M138 92 C154 74, 178 66, 204 72 C192 80, 180 86, 168 90" stroke-width="1.8" />
      <path d="M94 148 C108 126, 126 110, 146 102 C138 114, 130 124, 120 132" stroke-width="1.8" />
      <!-- Cabellera rizada esculpida de Eros (espirales y ondas detalladas) -->
      <path d="M132 132 C146 104, 184 92, 222 102 C254 110, 274 136, 268 166 C262 188, 244 202, 224 204" stroke-width="1.9" />
      <path d="M156 122 C166 112, 182 116, 178 128 C174 138, 160 134, 164 124" stroke-width="1.5" />
      <path d="M188 114 C202 106, 218 114, 212 128 C206 138, 192 132, 196 120" stroke-width="1.5" />
      <path d="M222 118 C238 112, 252 124, 244 138 C236 148, 222 140, 228 128" stroke-width="1.5" />
      <path d="M144 146 C156 138, 170 146, 164 158 C158 166, 146 160, 150 150" stroke-width="1.5" />
      <path d="M236 148 C250 144, 260 156, 252 168 C244 176, 232 168, 238 158" stroke-width="1.5" />
      <!-- Rostro de Eros inclinado con ternura -->
      <path d="M142 158 C144 186, 156 212, 176 232 C186 242, 198 244, 208 236 C224 222, 234 198, 236 172" stroke-width="2" />
      <!-- Ojos cerrados, nariz y labios de Eros -->
      <path d="M154 184 C162 188, 170 188, 176 184 M192 186 C200 190, 210 190, 218 184" stroke-width="1.6" />
      <path d="M184 182 L180 208 L188 212" stroke-width="1.7" />
      <path d="M176 220 C184 218, 192 218, 198 220 C192 225, 182 225, 176 220 Z" stroke-width="1.6" />
      <!-- Rostro de Psique mirando hacia arriba -->
      <path d="M138 282 C152 266, 174 256, 196 262 C214 268, 224 286, 216 306 C208 322, 188 330, 170 326" stroke-width="2" />
      <path d="M174 264 L182 254 L188 262" stroke-width="1.6" />
      <!-- Mano de Eros sosteniendo el rostro/cuello de Psique -->
      <path d="M166 336 C172 316, 182 302, 192 296 M180 342 C188 320, 198 306, 208 300 M194 346 C202 326, 212 312, 222 308 M208 348 C216 332, 224 320, 232 316" stroke-width="1.7" />
      <!-- Pliegues del mármol y brazos inferiores -->
      <path d="M104 242 C126 286, 146 338, 156 392 M296 224 C264 256, 232 292, 216 344" stroke-width="1.7" />
      <path d="M116 368 C126 392, 134 416, 128 438 M142 374 C150 398, 154 420, 148 440" stroke-width="1.4" />
    </svg>
  </div>

  <!-- GRABADO 3 (ABAJO CENTRO): El Beso de Víctor Delfín (Parque del Amor, Lima) convertido a grabado -->
  <div class="bg-etching etch-beso-lima">
    <svg viewBox="0 0 720 320" fill="none" stroke="#1f1b18" stroke-linecap="round" stroke-linejoin="round">
      <!-- Plataforma y pedestal del Parque del Amor en Lima -->
      <path d="M126 154 L594 154 L584 176 L418 176 L418 286 L302 286 L302 176 L136 176 Z" stroke-width="2.1" />
      <path d="M140 165 L580 165 M316 176 L316 286 M404 176 L404 286" stroke-width="1.2" />
      <rect x="342" y="192" width="22" height="28" stroke-width="1.2" />

      <!-- ESCULTURA DE LA PAREJA RECLINADA (Víctor Delfín) -->
      <!-- Piernas y pies extendidos hacia la izquierda -->
      <path d="M126 146 C118 140, 114 130, 122 122 C130 116, 142 122, 152 126 C182 124, 214 118, 246 112" stroke-width="2.2" />
      <path d="M128 152 C164 152, 204 148, 244 142" stroke-width="2" />
      <path d="M142 124 L146 148 M158 124 L162 148" stroke-width="1.3" />

      <!-- Piernas extendidas hacia la derecha -->
      <path d="M446 112 C486 118, 526 128, 566 138 C578 134, 592 132, 598 140 C602 146, 594 152, 582 152 C536 152, 488 150, 442 148" stroke-width="2.2" />

      <!-- Figura masculina arqueada encima besando -->
      <path d="M266 54 C264 38, 276 26, 294 26 C310 26, 322 36, 324 50" stroke-width="2.2" />
      <!-- Cabello largo esculpido hacia atrás -->
      <path d="M312 30 C334 32, 354 42, 368 56 C352 56, 338 54, 326 50" stroke-width="1.9" />
      <!-- Espalda y hombro musculoso -->
      <path d="M324 50 C354 54, 382 70, 396 96 C414 96, 434 102, 448 112" stroke-width="2.2" />

      <!-- Rostro femenino debajo recibiendo el beso -->
      <path d="M236 92 C228 80, 236 64, 254 60 C270 56, 286 64, 292 78" stroke-width="2.1" />
      <path d="M232 76 C222 86, 224 102, 238 110 C250 116, 264 112, 272 104" stroke-width="1.9" />

      <!-- Brazos entrelazados en el centro (el abrazo icónico) -->

  <!-- TÍTULO -->
  <header class="header-desk">
    <h1>Sai's sketchbook</h1>
  </header>

  <!-- Pestañas de la libreta -->
  <nav class="bookmark-tabs">
    <button class="tab-btn active" id="tab-coleccion" onclick="switchTab('coleccion')">Mi Pequeña Colección</button>
    <button class="tab-btn" id="tab-wishlist" onclick="switchTab('wishlist')">Wishlist & Bocetos por hacer</button>
  </nav>

  <!-- LIBRETA ABIERTA COMPACTA Y LISA -->
  <div class="book-stage">
    <div class="page-fan-left-2"></div>
    <div class="page-fan-left-1"></div>
    <div class="page-fan-right-1"></div>
    <div class="page-fan-right-2"></div>

    <main class="sketchbook-spread">
      <!-- VISTA 1: MI PEQUEÑA COLECCIÓN -->
      <section id="view-coleccion">
        <div class="gallery-grid" id="coleccion-grid">
          <p style="color: var(--ink-secondary); font-style: italic;">Cargando tus obras enmarcadas...</p>
        </div>
      </section>

      <!-- VISTA 2: WISHLIST -->
      <section id="view-wishlist" class="hidden">
        <div class="inspiration-box">
          <h3>¿Qué inspiración tienes hoy?</h3>
          <p style="font-size: 0.85rem; color: var(--ink-secondary); margin-bottom: 10px;">
            Describe lo que te gustaría dibujar aunque no tengas la referencia exacta, y te sugeriré composición, luces y enfoque artístico:
          </p>
          <div class="inspiration-controls">
            <input type="text" id="idea-input" placeholder="Ej: Unas manos acercándose como en la Creación de Adán, pero con lirios..." />
            <button class="btn-muse" onclick="generarIdea()">Idear boceto</button>
          </div>
          <div class="inspiration-result" id="idea-output"></div>
        </div>

        <div class="pinterest-masonry" id="wishlist-grid">
          <p style="color: var(--ink-secondary); font-style: italic;">Cargando tu muro de referencias...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Botón flotante con LIRIO grabado en tinta (igual a tu referencia) -->
  <div class="lily-tooltip">Añadir trazo o idea</div>
  <button class="lily-fab" onclick="openUploadModal()" title="Añadir nuevo dibujo o referencia">
    <svg class="lily-svg" viewBox="0 0 120 120" fill="none" stroke="#1f1b18" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pétalo superior izquierdo -->

      <!-- Nervaduras y sombreado de grabado en los pétalos -->
      <path d="M55 56 L38 32 M52 58 L34 42 M62 56 L78 24 M64 58 L82 34 M52 64 L24 64 M66 62 L96 56 M56 70 L44 96 M63 70 L78 88" stroke-width="0.9" />
      <path d="M32 34 L38 36 M32 38 L38 40 M76 18 L82 22 M74 22 L80 26 M18 64 L24 66 M18 68 L24 70 M40 94 L46 92 M42 98 L48 96 M96 54 L102 58 M94 58 L100 62" stroke-width="0.85" />
      <!-- Pecas características del lirio -->

      <circle cx="70" cy="50" r="0.9" fill="#1f1b18" stroke="none" />
      <circle cx="48" cy="60" r="0.9" fill="#1f1b18" stroke="none" />

      <ellipse cx="57" cy="25" rx="1.8" ry="3.4" transform="rotate(-5 57 25)" fill="#1f1b18" />
      <ellipse cx="68" cy="27" rx="1.8" ry="3.4" transform="rotate(14 68 27)" fill="#1f1b18" />

  <!-- MODAL 1: SUBIR OBRA -->
  <div class="modal-backdrop" id="upload-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('upload-modal')">&times;</button>
      <h2 style="font-family: 'Cormorant Garamond', serif; margin-bottom: 14px;">Guardar en Sai's sketchbook</h2>
      <form id="upload-form" onsubmit="handleUpload(event)">
        <div class="form-group">
          <label>¿Dónde quieres guardarlo?</label>
          <select id="obra-tipo">
            <option value="coleccion">Mi Pequeña Colección (Obra terminada con marco dorado)</option>
            <option value="wishlist">Wishlist (Referencia / Idea por dibujar)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Imagen del dibujo o referencia</label>
          <input type="file" id="obra-file" accept="image/*" required />
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="obra-titulo" placeholder="Ej: Estudio de manos / Eros y Psique" required />
        </div>
        <div class="form-group">
          <label>Técnica</label>
          <input type="text" id="obra-tecnica" value="Lápiz" />
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="text" id="obra-fecha" placeholder="Ej: Noviembre 2026" />
        </div>
        <div class="form-group">
          <label>¿Qué te inspiró o qué detalles quieres recordar?</label>
          <textarea id="obra-nota" rows="3" placeholder="Escribe aquí tu nota artística..."></textarea>
        </div>
        <div class="form-group">
          <label>Tu PIN secreto (para confirmar que eres tú)</label>
          <input type="password" id="obra-pin" placeholder="Introduce tu PIN" required />
        </div>
        <button type="submit" class="btn-muse" style="width: 100%;" id="submit-btn">Guardar en la base de datos</button>
      </form>
    </div>
  </div>

  <!-- MODAL 2: VER DETALLE -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
      <img id="det-img" class="detail-img" src="" alt="Obra" />
      <h2 id="det-titulo" style="font-family: 'Cormorant Garamond', serif; font-size: 1.7rem;"></h2>
      <p style="font-size: 0.9rem; color: var(--accent-terracotta); margin: 4px 0 12px;">
        <strong id="det-tecnica"></strong> · <span id="det-fecha"></span>
      </p>
      <p id="det-nota" style="font-style: italic; line-height: 1.6; background: var(--paper-dark); padding: 12px; border-radius: 8px;"></p>
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn-delete" id="det-delete-btn">Eliminar obra</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hllipxzifcwsvkxrdaou.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FzzSMk-LmOSUyfYHKwigkA_CcES_w5k';
    const MI_PIN_SECRETO = '1201';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
      document.getElementById('tab-coleccion').classList.toggle('active', tab === 'coleccion');
      document.getElementById('tab-wishlist').classList.toggle('active', tab === 'wishlist');
      document.getElementById('view-coleccion').classList.toggle('hidden', tab !== 'coleccion');
      document.getElementById('view-wishlist').classList.toggle('hidden', tab !== 'wishlist');
    }

    function openUploadModal() {
      document.getElementById('upload-modal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    async function cargarObras() {
      const { data, error } = await db.from('obras').select('*').order('created_at', { ascending: false });
      if (error) {
        console.error(error);
        document.getElementById('coleccion-grid').innerHTML = `<p style="color: #9e473b;">Error de conexión: ${error.message}</p>`;
        return;
      }

      const colGrid = document.getElementById('coleccion-grid');
      const wishGrid = document.getElementById('wishlist-grid');
      colGrid.innerHTML = '';
      wishGrid.innerHTML = '';

      const coleccion = data.filter(item => item.tipo === 'coleccion');
      const wishlist = data.filter(item => item.tipo === 'wishlist');

      if (coleccion.length === 0) {
        colGrid.innerHTML = '<p style="font-style:italic; color: var(--ink-secondary);">Tu libreta está en blanco esperando tu primer dibujo. Pulsa el lirio para añadir uno.</p>';
      } else {
        coleccion.forEach(obra => {
          const card = document.createElement('div');
          card.className = 'gold-frame-card';
          card.innerHTML = `
            <div class="gold-frame-inner">
              <img src="${obra.imagen_url}" alt="${obra.titulo}" loading="lazy" />
            </div>
            <div class="museum-plaque">
              <h3>${obra.titulo}</h3>
              <p>${obra.tecnica || 'Lápiz'} · ${obra.fecha || ''}</p>
            </div>
          `;
          card.onclick = () => verDetalle(obra);
          colGrid.appendChild(card);
        });
      }

      if (wishlist.length === 0) {
        wishGrid.innerHTML = '<p style="font-style:italic; color: var(--ink-secondary);">Aún no hay referencias en tu wishlist. Guarda ideas para cuando llegue tu cuaderno.</p>';
      } else {
        wishlist.forEach(item => {
          const pin = document.createElement('div');
          pin.className = 'pin-card';
          pin.innerHTML = `
            <img src="${item.imagen_url}" alt="${item.titulo}" loading="lazy" />
            <h4>${item.titulo}</h4>
            <p>${item.nota || 'Idea para el cuaderno'}</p>
            <div class="pin-actions">
              <button class="btn-hecho" onclick="marcarHecho('${item.id}')">✓ ¡Hecho!</button>
              <button class="btn-delete" onclick="borrarObra('${item.id}')">Borrar</button>
            </div>
          `;
          wishGrid.appendChild(pin);
        });
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      const pin = document.getElementById('obra-pin').value;
      if (pin !== MI_PIN_SECRETO) {
        alert('PIN incorrecto. Solo la dueña de la libreta puede subir obras.');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Guardando trazo...';

      try {
        const file = document.getElementById('obra-file').files[0];
        const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;

        const { error: uploadError } = await db.storage.from('dibujos').upload(fileName, file);
        if (uploadError) throw uploadError;

        const { data: urlData } = db.storage.from('dibujos').getPublicUrl(fileName);

        const nuevaObra = {
          tipo: document.getElementById('obra-tipo').value,
          titulo: document.getElementById('obra-titulo').value,
          tecnica: document.getElementById('obra-tecnica').value || 'Lápiz',
          fecha: document.getElementById('obra-fecha').value,
          nota: document.getElementById('obra-nota').value,
          imagen_url: urlData.publicUrl
        };

        const { error: insertError } = await db.from('obras').insert([nuevaObra]);
        if (insertError) throw insertError;

        document.getElementById('upload-form').reset();
        document.getElementById('obra-tecnica').value = 'Lápiz';
        closeModal('upload-modal');
        cargarObras();
      } catch (err) {
        alert('Error al subir: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar en la base de datos';
      }
    }

    function verDetalle(obra) {
      document.getElementById('det-img').src = obra.imagen_url;
      document.getElementById('det-titulo').textContent = obra.titulo;
      document.getElementById('det-tecnica').textContent = obra.tecnica || 'Lápiz';
      document.getElementById('det-fecha').textContent = obra.fecha || 'Sin fecha';
      document.getElementById('det-nota').textContent = obra.nota || 'Sin notas adicionales.';
      document.getElementById('det-delete-btn').onclick = () => borrarObra(obra.id, true);
      document.getElementById('detail-modal').classList.add('open');
    }

    async function marcarHecho(id) {
      const pin = prompt('Introduce tu PIN para mover este dibujo a Mi Pequeña Colección:');
      if (pin !== MI_PIN_SECRETO) {
        if (pin !== null) alert('PIN incorrecto.');
        return;
      }
      await db.from('obras').update({ tipo: 'coleccion' }).eq('id', id);
      cargarObras();
    }

    async function borrarObra(id, fromModal = false) {
      const pin = prompt('Introduce tu PIN para eliminar este elemento:');
      if (pin !== MI_PIN_SECRETO) {
        if (pin !== null) alert('PIN incorrecto.');
        return;
      }
      await db.from('obras').delete().eq('id', id);
      if (fromModal) closeModal('detail-modal');
      cargarObras();
    }

    function generarIdea() {
      const texto = document.getElementById('idea-input').value.trim().toLowerCase();
      const out = document.getElementById('idea-output');
      if (!texto) return;

      let sugerencia = `<strong>Propuesta para tu libreta sobre "${document.getElementById('idea-input').value}":</strong><br>`;

      if (texto.includes('mano') || texto.includes('adan') || texto.includes('adán') || texto.includes('tocar')) {
        sugerencia += `• <strong>Composición:</strong> Usa una diagonal ascendente inspirada en <em>La Creación de Adán</em>, dejando un espacio vacío de tensión justo antes de que las yemas se rocen.<br>• <strong>Técnica a lápiz:</strong> Trabaja los nudillos y tendones con grafito 2B/4B y deja el borde superior iluminado con goma moldeable para dar volumen escultórico.`;
      } else if (texto.includes('beso') || texto.includes('abrazo') || texto.includes('pareja') || texto.includes('eros') || texto.includes('psique')) {
        sugerencia += `• <strong>Composición:</strong> Inspírate en la torsión suave de <em>Eros y Psique</em> de Canova o la escultura <em>El Beso</em> de Víctor Delfín: enfócate en el encuentro de los rostros y las manos sosteniendo el cuello.<br>• <strong>Técnica a lápiz:</strong> Contrasta sombras profundas entre ambos perfiles con trazos sueltos y envolventes alrededor.`;
      } else if (texto.includes('flor') || texto.includes('lirio') || texto.includes('botan') || texto.includes('naturaleza')) {
        sugerencia += `• <strong>Composición:</strong> Combina un estudio botánico detallado en primer plano con líneas de construcción geométrica visibles al fondo (estilo cuaderno de estudio renacentista).<br>• <strong>Técnica a lápiz:</strong> Usa un portaminas fino (0.5) para las nervaduras de los pétalos y difumina suavemente la base del tallo.`;
      } else {
        sugerencia += `• <strong>Composición clásica:</strong> Divide la página lisa de tu libreta en un boceto principal en el centro y dos pequeños estudios de detalle (un ojo, un pliegue de tela o una mano) en las esquinas.<br>• <strong>Luz y atmósfera:</strong> Imagina una luz lateral tipo escultura de mármol (claroscuro marcado) usando lápiz HB para el encaje inicial y 4B para las sombras proyectadas.`;
      }

      out.innerHTML = sugerencia;
      out.style.display = 'block';
    }

    cargarObras();
  </script>
</body>
